#
# Project Configuration File
#
# A detailed documentation with the EXAMPLES is located here:
# http://docs.platformio.org/en/latest/projectconf.html
#

# A sign `#` at the beginning of the line indicates a comment
# Comment lines are ignored.

# Simple and base environment
# [env:mybaseenv]
# platform = %INSTALLED_PLATFORM_NAME_HERE%
# framework =
# board =
#
# Automatic targets - enable auto-uploading
# targets = upload

[application]
name = iot-arduino

[platformio]
default_envs = 
;  nodemcu
;  d1_mini  
;  lolin32
  esp32doit-devkit

[env]
build_flags = 
  -Wall -Werror -pedantic -std=gnu++17 -D__LIBRARY_NAME__=\"${application.name}\"
build_unflags = 
  -std=gnu++11  
monitor_speed = 
  115200  
lib_deps =
  robtillaart/CRC@1.0.2
  ArduinoMqttClient@0.1.7
  ArduinoJson@6.21.2
  spin-timer@3.0.0
  https://github.com/steftri/shell

[env:native]
platform = native
lib_compat_mode = off                  ; for beeing able to use arduino libraries in native environment

[env:nodemcu]
platform = espressif8266@4.2.0
board = nodemcuv2
framework = arduino
build_unflags = ${env.build_unflags} -pedantic ; -pedantic does not work because of the framework
build_flags = ${env.build_flags} 
              -DLED_WIFI=2 -DLED_WIFI_INVERT=true 
              -DLED_MQTT=16 -DLED_MQTT_INVERT=true 
              -DLED_USER1=5 
              -DPIN_ANALOG_IN=A0

[env:d1_mini]
platform = espressif8266@4.2.0
board = d1_mini
framework = arduino
build_unflags = ${env.build_unflags} -pedantic ; -pedantic does not work because of the framework
build_flags = ${env.build_flags} 
              -DLED_WIFI=2 -DLED_WIFI_INVERT=true 
              -DLED_MQTT=16 -DLED_MQTT_INVERT=false 
              -DLED_USER1=5 
              -DPIN_ANALOG_IN=A0

[env:esp32doit-devkit]
platform = espressif32@6.3.1
board = esp32doit-devkit-v1
framework = arduino
build_unflags = ${env.build_unflags} -pedantic ; -pedantic does not work because of the framework
build_flags = ${env.build_flags} 
              -DLED_WIFI=22 -DLED_WIFI_INVERT=false 
              -DLED_MQTT=16 -DLED_MQTT_INVERT=false
              -DLED_USER1=17 
              -DPIN_ANALOG_IN=32

[env:lolin32]
platform = espressif32@6.3.1
board = lolin32
framework = arduino
build_unflags = ${env.build_unflags} -pedantic ; -pedantic does not work because of the framework
build_flags = ${env.build_flags} 
              -DLED_WIFI=22 -DLED_WIFI_INVERT=true 
              -DLED_MQTT=16 -DLED_MQTT_INVERT=false
              -DLED_USER1=17 
              -DPIN_ANALOG_IN=32
                
